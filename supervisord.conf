[supervisord]
nodaemon=true

[program:java-server]
command=java -jar /app/libs/app.jar
directory=/app
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:ice-server]
command=bash -c "cd /app && ./gradlew :app:runIceServer"
directory=/app
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:node-proxy]
command=bash -c "cd /app/proxy && npm start"
directory=/app/proxy
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
